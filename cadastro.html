</head>

<body>

        <!-- Ícone do logotipo do topo -->

                </g>
            </svg>
        </div>
        <h1>Criar Conta</h1> <!-- Título para criação -->
        <p>Junte-se ao Academic Atelier</p> <!-- Subtítulo do cabeçalho -->
    </header>

    <main class="cartao-login">
        <!-- Formulário para novos dados -->
        <form id="cadastroForm">
            <div class="grupo-input">
                <label for="nome">NOME COMPLETO</label>
                <input type="text" id="nome" placeholder="Seu Nome" required>
            </div>

            <div class="grupo-input">
                <label for="email">E-MAIL</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">SENHA</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Botão principal -->
            <button type="submit" class="btn-entrar">
                Criar Conta <span>&rarr;</span>
            </button>

            <!-- Feedback da operação, se sucesso ou erro -->
            <div class="mensagem-erro" id="statusMsg" style="display: none;">
                <span class="icone-erro" style="background-color: #234e45;">✓</span> Conta criada com sucesso!
            </div>
        </form>



        <div class="link-cadastro">
            Já possui uma conta? <a href="index.html">Fazer Login</a> <!-- Retorno -->
        </div>
    </main>

    <!-- Rodapé preservando o layout -->
